<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FurZone</title>
<meta name="description" content="A social app for furries: share art, fursuits and VRChat moments.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
         background: radial-gradient(60rem 40rem at 110% -10%, rgba(236,72,153,.25), transparent 60%),
                     radial-gradient(50rem 40rem at -20% 20%, rgba(139,92,246,.3), transparent 60%), #0f0b1a;
         color: #f7f3ff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 440px; }
  h1 { font-size: 48px; margin: 0 0 8px; background: linear-gradient(135deg,#8b5cf6,#ec4899 55%,#fb923c);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #b1a5cc; }
  a.btn { display: inline-block; margin: 18px 0 8px; padding: 14px 26px; border-radius: 999px; color: #fff; font-weight: 700;
          text-decoration: none; background: linear-gradient(135deg,#8b5cf6,#ec4899 55%,#fb923c); }
  small { color: #75699a; }
</style>
</head>
<body>
<main>
  <h1>FurZone 🐾</h1>
  <p>Share your art, suits and VRChat adventures with your pack.</p>
  <a class="btn" href="https://github.com/SNUFFLES-boop/FurZone/releases/latest">Get the app (Android &amp; Windows)</a>
  <p><small>Made by Deltro.</small></p>
</main>
</body>
</html>
